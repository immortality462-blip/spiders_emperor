<style>
:root{--bg:#000;--tx:#eef1f8;--mu:#a0a0a0;--ac:#f2f2f2;--ac2:#9a9a9a;--bad:#ff7a8a;--ok:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.5 "Montserrat",system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.14;animation:fl 26s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:#fff}
.blobs i:nth-child(2){width:38vw;height:38vw;right:-6vw;top:20vh;background:#bdbdbd;animation-delay:-9s}
.blobs i:nth-child(3){width:42vw;height:42vw;left:30vw;bottom:-18vw;background:#8a8a8a;animation-delay:-17s}
@keyframes fl{to{transform:translate(8vw,6vh) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glass{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 30px rgba(255,255,255,.03),0 24px 60px rgba(0,0,0,.5)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 20% 0,rgba(255,255,255,.16),transparent 50%)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:14px auto;max-width:1180px;width:calc(100% - 28px);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}

.btn{cursor:pointer;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:10px 18px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,background .2s;white-space:nowrap}

.card{padding:18px;display:flex;flex-direction:column;gap:8px}
.orb{height:170px;border-radius:22px;display:grid;place-items:center;font-size:4.6rem;overflow:hidden;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),rgba(255,255,255,.06) 55%,rgba(255,255,255,.03) 80%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 2px 8px rgba(255,255,255,.25),inset 0 -14px 30px rgba(0,0,0,.35)}

.price{font-weight:700;font-size:1.15rem}
.low{color:#ffd37a;font-size:.8rem}

form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);min-height:1.2em;font-size:.9rem}
.hint{font-size:.8rem;color:var(--mu)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:8px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:12px 22px;z-index:99;transition:.3s;pointer-events:none}

.empty{text-align:center;color:var(--mu);padding:30px 0}

body{display:flex;flex-direction:column}main{flex:1;width:100%}
.foot{max-width:1180px;width:calc(100% - 28px);margin:0 auto 14px;padding:26px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;font-size:.88rem;color:var(--mu)}

.foot .copy{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;font-size:.8rem}
.foot .fb{display:flex;align-items:center;gap:10px;letter-spacing:.16em;margin-bottom:8px}.fb img{width:68px;height:68px;flex:none}
.link{background:none;border:0;padding:0;margin:0 0 4px;color:var(--tx);text-decoration:underline;cursor:pointer}
.about h3{margin:16px 0 6px;font-size:1rem}.about p{color:var(--mu);margin:0 0 12px}
.plain{background:none;border:0;padding:0;cursor:pointer;display:block;width:100%;border-radius:22px}.plain:hover .orb{border-color:rgba(255,255,255,.4)}
.card h3 .link{font:inherit;text-decoration:none;text-align:left}.card h3 .link:hover,.more:hover{text-decoration:underline}.more{font-size:.82rem;text-align:left;color:var(--mu)}
.big{height:240px;font-size:7rem}.dprice{font-size:1.6rem;font-weight:800;margin:4px 0 10px}.dd{color:var(--tx);line-height:1.6;margin:0 0 14px}
header #q{margin-left:auto}.pf{padding:8px 12px;border-radius:999px;font-weight:600}
.sale{position:absolute;top:26px;right:26px;z-index:1;background:#fff;color:#000;font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:99px}
.old{color:var(--mu);font-weight:400;font-size:.85rem;margin-right:6px;text-decoration:line-through}
#gear{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;width:64px;height:64px;padding:0;justify-content:center;border-radius:22.4%;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 34px rgba(0,0,0,.6)}
#gear svg{width:28px;height:28px}
#gear .badge{position:absolute;top:-4px;right:-4px;margin:0;min-width:24px;text-align:center;border:2px solid #fff;line-height:1.35}
main{padding-bottom:90px}
.wheel{position:relative;width:min(300px,72vw);margin:14px auto}
.wheel canvas{width:100%;height:auto;display:block;border-radius:50%;transition:transform 5s cubic-bezier(.12,.62,.08,1);box-shadow:0 0 0 6px rgba(255,255,255,.15),0 18px 50px rgba(0,0,0,.6)}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #fff;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.res{text-align:center;font-weight:700;min-height:2.8em;margin:12px 0}
/* karta: skrócony opis, zawijanie długich nazw i ceny */
.card{min-width:0}
.card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card h3,.panel h2{overflow-wrap:anywhere}
.card h3 .link{white-space:normal;overflow-wrap:anywhere}
.card .row{flex-wrap:wrap;gap:8px}
.card .price{min-width:0}
.card .row .btn{flex:none;margin-left:auto}
.card p,.dd{white-space:pre-line}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools .btn{padding:6px 14px}
.pv{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);min-height:2.4em;margin:0}
.bgl{position:absolute;filter:blur(3px);opacity:.09;pointer-events:none;user-select:none;object-fit:contain}
.island{margin:10px auto 0;width:46px;height:38px;border-radius:999px;background:#000;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:width .6s cubic-bezier(.3,1.35,.45,1),height .5s,margin .5s,opacity .4s,border-width .3s;font-size:.8rem;font-weight:600;letter-spacing:.02em}
.island .in{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.island img{width:22px;height:22px;flex:none}
#islt{display:block;max-width:calc(100vw - 110px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .28s,filter .28s,transform .28s}
#islt.out{opacity:0;filter:blur(7px);transform:scale(.88)}
#vt{margin-top:6px}
@keyframes bspin{to{transform:rotate(360deg)}}
.bgl{will-change:transform}
#menu{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:21;width:min(240px,calc(100vw - 36px));padding:8px;display:grid;gap:2px;transform-origin:bottom right;transform:scale(.6);opacity:0;visibility:hidden;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .2s,visibility 0s .35s}
#menu.open{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;border-radius:16px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.12)}
.mi span:first-child{font-size:1.15rem;width:1.4em;text-align:center}
.island.gone{width:0!important;height:0;margin-top:0;opacity:0;border-width:0}
.dots{position:relative;width:28px;height:28px;display:block}
.dots .d{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:99px;background:currentColor;transition:transform .45s cubic-bezier(.3,1.5,.5,1),width .35s,height .35s,margin .35s,scale .2s,opacity .2s;animation:dw 1.8s ease-in-out infinite}
.dots .d:nth-child(1){transform:translateX(-10px)}
.dots .d:nth-child(2){animation-delay:.15s}
.dots .d:nth-child(3){transform:translateX(10px);animation-delay:.3s}
@keyframes dw{0%,55%,100%{translate:0 0}25%{translate:0 -6px}}
#gear:hover .d{scale:1.2}
#gear[aria-expanded=true] .d{animation:none}
#gear[aria-expanded=true] .d:nth-child(1){width:22px;height:3px;margin:-1.5px 0 0 -11px;transform:rotate(45deg)}
#gear[aria-expanded=true] .d:nth-child(3){width:22px;height:3px;margin:-1.5px 0 0 -11px;transform:rotate(-45deg)}
#gear[aria-expanded=true] .d:nth-child(2){opacity:0;scale:0}
</style>
</head>

/* ---------- admin auth ---------- */
const ITER=210000,enc=new TextEncoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt,it){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256))}
const same=(a,b)=>{let d=a.length^b.length;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
const strong=p=>p.length>=12&&p.length<=128&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p)&&/[^\w\s]/.test(p);
let admin=false,last=0;
const touch=()=>{last=Date.now()};
setInterval(()=>{if(admin&&Date.now()-last>600000){logout();toast('Sesja wygasła z powodu bezczynności')}},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&admin&&Date.now()-last>120000)logout()});
function logout(){admin=false;$('#dA').close();$('#dP').close();$('#admt').textContent='Panel admina'}
async function tryLogin(u,p){
  const L=S.get('shop.lock',{n:0,until:0});
  if(Date.now()<L.until)return'Zbyt wiele prób. Odczekaj '+Math.ceil((L.until-Date.now())/1000)+' s.';
  const a=S.get('shop.admin',null),ok0=a&&typeof a.salt==='string'&&typeof a.hash==='string';
  let salt,it=ITER;try{salt=ok0?unb64(a.salt):crypto.getRandomValues(new Uint8Array(16));if(ok0&&Number.isInteger(a.it))it=a.it}catch(e){salt=crypto.getRandomValues(new Uint8Array(16))}
  const hh=await kdf(p,salt,it);
  if(ok0&&u.toLowerCase()===a.u&&same(hh,unb64(a.hash))){S.set('shop.lock',{n:0,until:0});admin=true;touch();return''}
  L.n=(L.n||0)+1;if(L.n>=5)L.until=Date.now()+Math.min(30000*2**(L.n-5),3600000);S.set('shop.lock',L);
  return'Nieprawidłowy login lub hasło.';
}
/* Skrót: imię i nazwisko = QUICK otwiera panel admina bez logowania. Ustaw QUICK='' aby wyłączyć. */
const QUICK='daxe god';
function quickAdmin(name){
  if(!QUICK||String(name).toLowerCase().replace(/\s+/g,' ').trim()!==QUICK)return false;
  admin=true;touch();$('#dU').close();$('#dK').close();renderAdmin();return true;
}
function adminEntry(){
  if(admin){renderAdmin();return}
  const a=S.get('shop.admin',null),setup=!a,b=$('#pL');clr(b);
  const err=h('div',{class:'err',role:'alert'}),go=h('button',{class:'btn pri',type:'submit'},setup?'Utwórz konto admina':'Zaloguj');
  const f=h('form',{novalidate:true},h('h2',{},setup?'Pierwsza konfiguracja':'Logowanie admina'),
    setup?h('p',{class:'hint'},'Nie ma jeszcze konta administratora. Ustaw login i silne hasło (min. 12 znaków: mała i wielka litera, cyfra, znak specjalny).'):'',
    field('Login','u',{maxlength:32,autocomplete:'username'}),field('Hasło','p',{type:'password',maxlength:128,autocomplete:setup?'new-password':'current-password'}),
    setup?field('Powtórz hasło','p2',{type:'password',maxlength:128,autocomplete:'new-password'}):'',err,
    h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:()=>$('#dL').close()},'Anuluj'),go));
  f.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';const u=str(f.u.value,32).toLowerCase(),p=f.p.value;
    go.disabled=true;
    try{
      if(setup){
        if(!/^[a-z0-9_.-]{3,32}$/.test(u))err.textContent='Login: 3–32 znaków (litery, cyfry, _ . -).';
        else if(!strong(p))err.textContent='Hasło jest za słabe.';
        else if(p!==f.p2.value)err.textContent='Hasła nie są takie same.';
        else{const salt=crypto.getRandomValues(new Uint8Array(16));S.set('shop.admin',{u,salt:b64(salt),hash:b64(await kdf(p,salt,ITER)),it:ITER});}
        if(err.textContent)return;
